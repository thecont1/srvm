# Injected into every cargo-dist build job before artifacts are built.
# The windows-11-arm image's preinstalled rustup resolves x64 toolchains
# under emulation; force the native aarch64 toolchain there so the release
# build is a native execution rather than a refused cross-compile.
- name: 'Force the native aarch64 toolchain on Windows ARM64 runners'
  shell: bash
  run: |
    if [ "${RUNNER_ARCH:-}" = "ARM64" ] && [ "${RUNNER_OS:-}" = "Windows" ]; then
      rustup toolchain install 1.97.1-aarch64-pc-windows-msvc --profile minimal
      rustup default 1.97.1-aarch64-pc-windows-msvc
      # The repo rust-toolchain.toml would resolve through the x64 shim and
      # rebuild on x86_64; drop it for this job only.
      rm -f rust-toolchain.toml
    fi
