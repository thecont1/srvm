name: CI

# The test job executes dependency build scripts; keep the default token out
# of .git/config (persist-credentials below) and limited to reading the repo.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned to the repo toolchain (rust-toolchain.toml, 1.97.1): the same
      # verified compiler that ships the release artifacts.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # Gate dependency advisories (OSV/RustSec) so the next `rustls-webpki`-style
  # finding is caught by CI rather than by hand.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # `checks: write` lets rustsec/audit-check publish its check run; scoped to
    # this job so the test matrix keeps least privilege.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
