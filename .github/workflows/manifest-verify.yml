name: Manifest verify

# Checks the Scoop and winget manifests generated from a published release, on
# Windows, for both architectures.
#
# Why not `winget validate`: GitHub's Windows runners do not ship winget (the
# command is not on PATH), so it cannot run here. Instead this validates the
# three winget manifests against the official schemas they declare
# (ManifestVersion 1.6.0), and then performs the install the manifest actually
# describes — download the InstallerUrl, check it against InstallerSha256,
# unpack, and run the binary — which is the part a schema cannot prove. The
# real `winget validate` runs in winget-pkgs CI when the manifest is submitted,
# and that submission is a separately approved step at the stable gate.
#
# Dispatch only: nothing here publishes or submits anything.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to generate and verify manifests for
        required: true
        default: v0.1.1

permissions:
  contents: read

jobs:
  manifests:
    name: manifests (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            runner: windows-2022
            winget_arch: x64
          - label: arm64
            runner: windows-11-arm
            winget_arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Download the release manifest and its checksum sidecars
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p checksums out
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --pattern dist-manifest.json --dir .
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --pattern '*.sha256' --dir checksums

      - name: Generate the manifests from the published release
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/gen_manifests.py \
            --manifest dist-manifest.json \
            --sha256-dir checksums \
            --repo "${{ github.repository }}" \
            --tag "${{ inputs.tag }}" \
            --out-dir out
          find out -type f | sort

      - name: Validate the winget manifests against their declared schemas
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check check-jsonschema PyYAML
          version="${{ inputs.tag }}"
          version="${version#v}"
          dir="out/winget/thecont1.srvm/${version}"
          check-jsonschema --schemafile "https://aka.ms/winget-manifest.version.1.6.0.schema.json" \
            "${dir}/thecont1.srvm.yaml"
          check-jsonschema --schemafile "https://aka.ms/winget-manifest.installer.1.6.0.schema.json" \
            "${dir}/thecont1.srvm.installer.yaml"
          check-jsonschema --schemafile "https://aka.ms/winget-manifest.defaultLocale.1.6.0.schema.json" \
            "${dir}/thecont1.srvm.locale.en-US.yaml"

      - name: Perform the install the manifest describes, then smoke it
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ inputs.tag }}" "${{ matrix.winget_arch }}" <<'PY'
          import hashlib, pathlib, subprocess, sys, urllib.request, zipfile, yaml

          tag, arch = sys.argv[1], sys.argv[2]
          version = tag[1:] if tag.startswith("v") else tag
          manifest = pathlib.Path(f"out/winget/thecont1.srvm/{version}/thecont1.srvm.installer.yaml")
          entries = yaml.safe_load(manifest.read_text())["Installers"]
          entry = next(e for e in entries if e["Architecture"] == arch)
          url, expected = entry["InstallerUrl"], entry["InstallerSha256"]
          print(f"arch={arch} url={url}")

          archive = pathlib.Path("payload.zip")
          urllib.request.urlretrieve(url, archive)
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert actual == expected, f"sha256 mismatch: manifest {expected} != download {actual}"
          print(f"sha256 matches the manifest: {actual}")

          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              print(f"archive contents: {names}")
              z.extractall("payload")

          exe = next(p for p in pathlib.Path("payload").rglob("srvm.exe"))
          out = subprocess.run([str(exe), "--version"], capture_output=True, text=True, timeout=60)
          print(f"binary reported: {out.stdout.strip()!r} (exit {out.returncode})")
          assert out.returncode == 0 and version in out.stdout, "the installed binary did not report its version"
          PY

      - name: Parse the Scoop manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("out/scoop/srvm.json").read_text())
          print("scoop version:", m["version"])
          for arch, spec in m["architecture"].items():
              assert spec.get("url"), f"scoop {arch} has no url"
              assert spec.get("hash"), f"scoop {arch} has no hash"
              print(f"scoop {arch}: {spec['bin']} <- {spec['url']} {spec['hash'][:24]}...")
          PY
