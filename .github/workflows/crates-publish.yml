name: Publish to crates.io

# Manual on purpose. cargo-dist does not publish to crates.io, and the
# tag-triggered release run must not gain a step that fails when a secret is
# missing, so the RC's first real publish stays exactly as proven.
#
# This workflow covers the token-based FIRST publish: crates.io requires an
# initial publish with an API token before trusted publishing can be configured
# ("Your crate must already be published to crates.io"; RFC 3691: "A Trusted
# Publisher Configuration can only be created after an initial manual
# publishing of a crate"). Once the crate exists and trusted publishing is set
# up for thecont1/srvm, delete this workflow — and the token with it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (must match the version in Cargo.toml)
        required: true
        default: v0.1.0
      dry_run:
        description: Only run cargo publish --dry-run
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Confirm the manifest version matches the tag
        shell: bash
        # The tag reaches the script through the environment, never through the
        # script source: an interpolated input would be executed as Bash before
        # this check could object to it.
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          got="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$got" != "$want" ]; then
            echo "tag $TAG does not match the Cargo.toml version $got" >&2
            exit 1
          fi
          echo "publishing srvm $got"
      - name: Show the packaged contents
        run: cargo package --locked --list
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish --locked --dry-run
          else
            cargo publish --locked
          fi