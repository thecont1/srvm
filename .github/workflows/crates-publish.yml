name: Publish to crates.io

# Manual on purpose. cargo-dist does not publish to crates.io, and the
# tag-triggered release run must not gain a step that fails when a secret is
# missing, so publishing stays a deliberate dispatch.
#
# Authentication is crates.io trusted publishing (RFC 3691): the OIDC token
# GitHub issues this job is exchanged for a short-lived cargo token, so no
# API token is stored in repository secrets. This requires a Trusted
# Publisher config on crates.io for thecont1/srvm naming this workflow file;
# if an environment is set there it must match the job's `environment` field
# (currently unset). The token-based first publish that seeded the crate is
# history.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (must match the version in Cargo.toml)
        required: true
        default: v0.1.1
      dry_run:
        description: Only run cargo publish --dry-run
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Confirm the manifest version matches the tag
        shell: bash
        # The tag reaches the script through the environment, never through the
        # script source: an interpolated input would be executed as Bash before
        # this check could object to it.
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          got="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$got" != "$want" ]; then
            echo "tag $TAG does not match the Cargo.toml version $got" >&2
            exit 1
          fi
          echo "publishing srvm $got"
      - name: Show the packaged contents
        run: cargo package --locked --list
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish --locked --dry-run
          else
            cargo publish --locked
          fi