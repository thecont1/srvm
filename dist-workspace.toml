[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.28.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# Whether to publish prereleases to package managers
publish-prereleases = false
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Attach GitHub provenance attestations to every artifact
github-attestations = true
# Publish the formula to the Homebrew tap on stable releases (skipped for
# prereleases per publish-prereleases=false). The tap repository and the
# HOMEBREW_TAP_TOKEN secret are approval-gated setup steps; without them the
# publish job fails loudly at stable time rather than silently skipping.
publish-jobs = ["homebrew"]
tap = "thecont1/homebrew-srvm"
# PRs build all six native artifacts and keep them as workflow artifacts
# (no release, no publishing) so the matrix is exercised before any tag.
pr-run-mode = "upload"
# Release toolchain is pinned independently of the declared MSRV (1.89) via
# rust-toolchain.toml: artifacts ship the locally verified 1.97.1.
# Windows builds link the CRT statically where the toolchain supports it.
msvc-crt-static = true
# The windows-11-arm image's preinstalled rustup resolves x64 toolchains
# under emulation; force the native aarch64 toolchain there so the release
# build is a native execution rather than a refused cross-compile.
github-build-setup = "../build-setup.yaml"

# Six native execution hosts: each target builds, tests, and smokes on a
# runner of its own architecture — never cross-compile only. The 0.28.0
# defaults (macos-13, windows-2019, ubuntu-20.04, and a linux-hosted
# windows-arm64 cross build) are retired or wrong for that requirement.
[dist.github-custom-runners]
"global" = "ubuntu-22.04"
"x86_64-apple-darwin" = "macos-15-intel"
"aarch64-apple-darwin" = "macos-15"
"x86_64-unknown-linux-gnu" = "ubuntu-22.04"
"aarch64-unknown-linux-gnu" = "ubuntu-22.04-arm"
"x86_64-pc-windows-msvc" = "windows-2022"
"aarch64-pc-windows-msvc" = "windows-11-arm"

[dist.github]
release-branch = "main"
