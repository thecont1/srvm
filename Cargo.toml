[package]
name = "srvm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Zero-config universal app launcher"
license = "MIT"
repository = "https://github.com/thecont1/srvm"
homepage = "https://github.com/thecont1/srvm"
readme = "README.md"
keywords = ["launcher", "developer-tools", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
cap-std = "=4.0.3"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
httparse = "=1.10.1"
libc = "0.2"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
flate2 = "1.0"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "3.0", default-features = false, features = ["rustls"] }
zip = "2.2"

[dev-dependencies]
assert_cmd = "2.0"
flate2 = "1.0"
predicates = "3.1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.14"
zip = "2.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
